name: Dockerize branch

on:
  push:
    branches-ignore:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: dockerize-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  dockerize:
    name: Build & push branch image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Compute image tag
        id: meta
        env:
          REF: ${{ github.ref_name }}
        run: |
          TAG=$(echo "$REF" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # Branches without a root Dockerfile skip the docker steps cleanly
      # instead of failing; the job still reports success.
      - name: Set up Docker Buildx
        if: hashFiles('Dockerfile') != ''
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: hashFiles('Dockerfile') != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: hashFiles('Dockerfile') != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.tag }}
